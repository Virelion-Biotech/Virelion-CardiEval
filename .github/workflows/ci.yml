name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        numpy-version: ["1.26.*", "2.0.*"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pip install --upgrade --force-reinstall "numpy==${{ matrix.numpy-version }}"
      - run: python -m pip check
      - run: ruff check .
      - run: pytest -q
      - run: pip-audit

  package-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m build
      - run: python validation/generate_synthetic_benchmark.py --n 500 --seed 42
      - run: python validation/run_local_validation.py --pytest
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "import cardieval; print(cardieval.__version__)"
