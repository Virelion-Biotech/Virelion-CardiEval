[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cardieval"
version = "0.9.0"
description = "Independent evaluation framework for cardiac challenge models"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Virelion Biotech"}]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "scipy>=1.12",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
cardieval = "cardieval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cardieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
