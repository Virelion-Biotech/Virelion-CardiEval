[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cardieval"
dynamic = ["version"]
description = "Independent evaluation framework for cardiac machine-learning models"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Virelion Biotech"}]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "scipy>=1.12",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "ruff>=0.6",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "build>=1.2",
  "pip-audit>=2.7",
]

[project.scripts]
cardieval = "cardieval.cli:main"

[tool.hatch.version]
path = "src/cardieval/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cardieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
strict_markers = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
